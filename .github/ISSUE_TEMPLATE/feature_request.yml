name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 你遇到了什么问题？现有能力为什么不够用？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望 dshctl 提供怎样的行为？（可给出拟议的命令与输出）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或临时绕过方式
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关日志、截图、上游变更链接等
    validations:
      required: false
